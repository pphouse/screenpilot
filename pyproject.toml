[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenpilot"
version = "0.1.0"
description = "AI-powered desktop automation using vision + LLM. A smarter alternative to traditional RPA."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "ScreenPilot Team" },
]
keywords = ["automation", "rpa", "llm", "computer-use", "ocr", "vision", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Office/Business",
]
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "litellm>=1.50.0",
    "pillow>=10.0.0",
    "mss>=9.0.0",
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
ocr = [
    "easyocr>=1.7.0",
    "paddleocr>=2.7.0",
]

[project.scripts]
screenpilot = "screenpilot.cli:main"

[project.urls]
Homepage = "https://github.com/pphouse/screenpilot"
Repository = "https://github.com/pphouse/screenpilot"
Issues = "https://github.com/pphouse/screenpilot/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
